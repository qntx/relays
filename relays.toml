# Relay directory curation — single source of truth.
#
# `[[collection]]` tables define curated collections in display order; each
# needs `id`, a localized `name` (with `en`) and a non-empty `relays` list of
# canonical `wss://` URLs in editorial order.
#
# `[[relay]]` tables hold per-relay editorial overrides (`name`,
# `description`, `languages`, `nsfw`) and appear only when a relay needs one,
# sorted by `url`.

